name: Release Polling VM

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: release-polling-vm-${{ github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: cr.yandex/${{ vars.YC_REGISTRY_ID }}
  API_IMAGE: cr.yandex/${{ vars.YC_REGISTRY_ID }}/ion-gift-card-api:${{ github.ref_name }}
  BOT_POLLING_IMAGE: cr.yandex/${{ vars.YC_REGISTRY_ID }}/ion-gift-card-bot-polling:${{ github.ref_name }}
  MIGRATIONS_IMAGE: cr.yandex/${{ vars.YC_REGISTRY_ID }}/ion-gift-card-migrations:${{ github.ref_name }}

jobs:
  release:
    name: Build and deploy release
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deployment variables
        env:
          YC_CI_SA_ID: ${{ vars.YC_CI_SA_ID }}
          YC_FOLDER_ID: ${{ vars.YC_FOLDER_ID }}
          YC_REGISTRY_ID: ${{ vars.YC_REGISTRY_ID }}
          YC_RUNTIME_SA_ID: ${{ vars.YC_RUNTIME_SA_ID }}
          YC_API_CONTAINER_NAME: ${{ vars.YC_API_CONTAINER_NAME }}
          YC_LOCKBOX_SECRET_ID: ${{ vars.YC_LOCKBOX_SECRET_ID }}
          YC_QR_MINI_APP_BUCKET: ${{ vars.YC_QR_MINI_APP_BUCKET }}
          YC_NETWORK_ID: ${{ vars.YC_NETWORK_ID }}
          YC_SUBNET_ID: ${{ vars.YC_SUBNET_ID }}
          YC_ZONE: ${{ vars.YC_ZONE }}
          YC_BOT_VM_NAME: ${{ vars.YC_BOT_VM_NAME || 'ion-gift-card-bot' }}
          YC_BOT_VM_CORES: ${{ vars.YC_BOT_VM_CORES || '2' }}
          YC_BOT_VM_MEMORY: ${{ vars.YC_BOT_VM_MEMORY || '2' }}
          YC_BOT_VM_CORE_FRACTION: ${{ vars.YC_BOT_VM_CORE_FRACTION || '20' }}
          YC_BOT_VM_DISK_SIZE: ${{ vars.YC_BOT_VM_DISK_SIZE || '16' }}
          YC_BOT_VM_DISK_TYPE: ${{ vars.YC_BOT_VM_DISK_TYPE || 'network-hdd' }}
          YC_BOT_VM_PLATFORM: ${{ vars.YC_BOT_VM_PLATFORM || 'standard-v3' }}
          YC_BOT_VM_PUBLIC_NAT: ${{ vars.YC_BOT_VM_PUBLIC_NAT || 'true' }}
          DB_SSL: ${{ vars.DB_SSL || 'true' }}
          DB_POOL_MIN: ${{ vars.DB_POOL_MIN || '0' }}
          DB_POOL_MAX: ${{ vars.DB_POOL_MAX || '2' }}
        run: |
          set -euo pipefail

          required_vars=(
            YC_CI_SA_ID
            YC_FOLDER_ID
            YC_REGISTRY_ID
            YC_RUNTIME_SA_ID
            YC_API_CONTAINER_NAME
            YC_LOCKBOX_SECRET_ID
            YC_QR_MINI_APP_BUCKET
            YC_NETWORK_ID
            YC_SUBNET_ID
          )

          optional_vars=(
            YC_ZONE
            YC_BOT_VM_NAME
            YC_BOT_VM_CORES
            YC_BOT_VM_MEMORY
            YC_BOT_VM_CORE_FRACTION
            YC_BOT_VM_DISK_SIZE
            YC_BOT_VM_DISK_TYPE
            YC_BOT_VM_PLATFORM
            YC_BOT_VM_PUBLIC_NAT
            DB_SSL
            DB_POOL_MIN
            DB_POOL_MAX
          )

          missing_vars=()
          for var_name in "${required_vars[@]}"; do
            if [[ -z "${!var_name:-}" ]]; then
              missing_vars+=("$var_name")
            fi
          done

          printf 'Required GitHub Actions variables:\n'
          for var_name in "${required_vars[@]}"; do
            if [[ -n "${!var_name:-}" ]]; then
              printf ' - %s: set\n' "$var_name"
            else
              printf ' - %s: missing\n' "$var_name"
            fi
          done

          if (( ${#missing_vars[@]} > 0 )); then
            printf '\nMissing required GitHub Actions variables:\n'
            printf ' - %s\n' "${missing_vars[@]}"
            printf 'Add them as repository or production environment variables.\n'
            exit 1
          fi

          printf '\nOptional GitHub Actions variables and defaults:\n'
          for var_name in "${optional_vars[@]}"; do
            if [[ -n "${!var_name:-}" ]]; then
              printf ' - %s: set\n' "$var_name"
            else
              printf ' - %s: unset\n' "$var_name"
            fi
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Get Yandex Cloud IAM token
        id: iam-token
        uses: docker://ghcr.io/yc-actions/yc-iam-token-fed:1.0.0
        with:
          yc-sa-id: ${{ vars.YC_CI_SA_ID }}

      - name: Install Yandex Cloud CLI
        run: |
          curl --fail --silent --show-error --location https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -a
          echo "$HOME/yandex-cloud/bin" >> "$GITHUB_PATH"

      - name: Configure Yandex Cloud CLI
        env:
          YC_IAM_TOKEN: ${{ steps.iam-token.outputs.token }}
        run: |
          yc config set folder-id "${{ vars.YC_FOLDER_ID }}"

      - name: Read release secrets from Lockbox
        env:
          YC_IAM_TOKEN: ${{ steps.iam-token.outputs.token }}
          YC_LOCKBOX_SECRET_ID: ${{ vars.YC_LOCKBOX_SECRET_ID }}
        run: |
          set -euo pipefail

          export_secret() {
            local key="$1"
            local value

            value="$(yc lockbox payload get --id "$YC_LOCKBOX_SECRET_ID" --key "$key")"

            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          }

          export_secret DB_HOST
          export_secret DB_PORT
          export_secret DB_NAME
          export_secret DB_USER
          export_secret DB_PASSWORD
          export_secret TELEGRAM_BOT_TOKEN
          export_secret WEB_APP_URL

      - name: Deploy QR Mini App to Object Storage
        env:
          YC_IAM_TOKEN: ${{ steps.iam-token.outputs.token }}
          YC_QR_MINI_APP_BUCKET: ${{ vars.YC_QR_MINI_APP_BUCKET }}
        run: |
          set -euo pipefail

          qr_mini_app_url="https://storage.yandexcloud.net/${YC_QR_MINI_APP_BUCKET}/qr.html"

          if [[ "$WEB_APP_URL" != "$qr_mini_app_url" ]]; then
            printf 'WEB_APP_URL must point to the static QR Mini App object.\n' >&2
            printf 'Expected: %s\n' "$qr_mini_app_url" >&2
            printf 'Actual:   %s\n' "$WEB_APP_URL" >&2
            printf 'Update WEB_APP_URL in Lockbox before deploying.\n' >&2
            exit 1
          fi

          yc storage s3 cp src/api/qr-mini-app.html "s3://${YC_QR_MINI_APP_BUCKET}/qr.html" \
            --acl public-read \
            --content-type 'text/html; charset=utf-8' \
            --cache-control 'no-cache, no-store, must-revalidate'

          curl --fail --show-error --silent "$WEB_APP_URL" >/dev/null

      - name: Login to Yandex Cloud Container Registry
        uses: yc-actions/yc-cr-login@v3
        with:
          yc-iam-token: ${{ steps.iam-token.outputs.token }}

      - name: Build and push API image
        run: |
          docker build --target api -t "$API_IMAGE" .
          docker push "$API_IMAGE"

      - name: Build and push bot polling image
        run: |
          docker build --target bot-long-polling -t "$BOT_POLLING_IMAGE" .
          docker push "$BOT_POLLING_IMAGE"

      - name: Build and push migrations image
        run: |
          docker build --target migrations -t "$MIGRATIONS_IMAGE" .
          docker push "$MIGRATIONS_IMAGE"

      - name: Run database migrations
        env:
          DB_SSL: ${{ vars.DB_SSL || 'true' }}
          DB_POOL_MIN: ${{ vars.DB_POOL_MIN || '0' }}
          DB_POOL_MAX: ${{ vars.DB_POOL_MAX || '2' }}
        run: |
          docker run --rm \
            -e DB_HOST \
            -e DB_PORT \
            -e DB_NAME \
            -e DB_USER \
            -e DB_PASSWORD \
            -e DB_SSL \
            -e DB_POOL_MIN \
            -e DB_POOL_MAX \
            "$MIGRATIONS_IMAGE" \
            node --experimental-strip-types src/db/migrations/run.ts

      - name: Deploy API container
        uses: yc-actions/yc-sls-container-deploy@v4
        with:
          yc-iam-token: ${{ steps.iam-token.outputs.token }}
          folder-id: ${{ vars.YC_FOLDER_ID }}
          container-name: ${{ vars.YC_API_CONTAINER_NAME }}
          revision-service-account-id: ${{ vars.YC_RUNTIME_SA_ID }}
          revision-image-url: ${{ env.API_IMAGE }}
          revision-cores: 1
          revision-memory: 512Mb
          revision-core-fraction: 100
          revision-concurrency: 8
          revision-execution-timeout: 10
          revision-network-id: ${{ vars.YC_NETWORK_ID }}
          revision-env: |
            API_HOST=0.0.0.0
            DB_SSL=${{ vars.DB_SSL || 'true' }}
            DB_POOL_MIN=${{ vars.DB_POOL_MIN || '0' }}
            DB_POOL_MAX=${{ vars.DB_POOL_MAX || '2' }}
          revision-secrets: |
            DB_HOST=${{ vars.YC_LOCKBOX_SECRET_ID }}/latest/DB_HOST
            DB_PORT=${{ vars.YC_LOCKBOX_SECRET_ID }}/latest/DB_PORT
            DB_NAME=${{ vars.YC_LOCKBOX_SECRET_ID }}/latest/DB_NAME
            DB_USER=${{ vars.YC_LOCKBOX_SECRET_ID }}/latest/DB_USER
            DB_PASSWORD=${{ vars.YC_LOCKBOX_SECRET_ID }}/latest/DB_PASSWORD

      - name: Deploy bot polling VM
        env:
          YC_IAM_TOKEN: ${{ steps.iam-token.outputs.token }}
          YC_BOT_VM_NAME: ${{ vars.YC_BOT_VM_NAME || 'ion-gift-card-bot' }}
          YC_ZONE: ${{ vars.YC_ZONE }}
          YC_SUBNET_ID: ${{ vars.YC_SUBNET_ID }}
          YC_RUNTIME_SA_ID: ${{ vars.YC_RUNTIME_SA_ID }}
          YC_FOLDER_ID: ${{ vars.YC_FOLDER_ID }}
          YC_LOCKBOX_SECRET_ID: ${{ vars.YC_LOCKBOX_SECRET_ID }}
          YC_BOT_VM_CORES: ${{ vars.YC_BOT_VM_CORES || '2' }}
          YC_BOT_VM_MEMORY: ${{ vars.YC_BOT_VM_MEMORY || '2' }}
          YC_BOT_VM_CORE_FRACTION: ${{ vars.YC_BOT_VM_CORE_FRACTION || '20' }}
          YC_BOT_VM_DISK_SIZE: ${{ vars.YC_BOT_VM_DISK_SIZE || '16' }}
          YC_BOT_VM_DISK_TYPE: ${{ vars.YC_BOT_VM_DISK_TYPE || 'network-hdd' }}
          YC_BOT_VM_PLATFORM: ${{ vars.YC_BOT_VM_PLATFORM || 'standard-v3' }}
          YC_BOT_VM_PUBLIC_NAT: ${{ vars.YC_BOT_VM_PUBLIC_NAT || 'true' }}
          DB_SSL: ${{ vars.DB_SSL || 'true' }}
          DB_POOL_MIN: ${{ vars.DB_POOL_MIN || '0' }}
          DB_POOL_MAX: ${{ vars.DB_POOL_MAX || '2' }}
        run: .github/scripts/deploy-yc-polling-vm.sh

      - name: Disable Telegram webhook for polling
        run: |
          curl --fail --show-error --silent "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/deleteWebhook" \
            --data-urlencode "drop_pending_updates=false"

      - name: Reset Telegram persistent menu button
        run: |
          set -euo pipefail

          curl --fail --show-error --silent "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setChatMenuButton" \
            --data-urlencode 'menu_button={"type":"default"}' >/dev/null

          actual_type="$(curl --fail --show-error --silent "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getChatMenuButton" \
            | jq -r '.result.type // empty')"

          if [[ "$actual_type" == "web_app" ]]; then
            printf 'Telegram persistent menu button is still configured as WebApp.\n' >&2
            exit 1
          fi

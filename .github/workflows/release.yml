name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: cr.yandex/${{ secrets.YC_REGISTRY_ID }}
  API_IMAGE: cr.yandex/${{ secrets.YC_REGISTRY_ID }}/ion-gift-card-api:${{ github.ref_name }}
  BOT_WEBHOOK_IMAGE: cr.yandex/${{ secrets.YC_REGISTRY_ID }}/ion-gift-card-bot-webhook:${{ github.ref_name }}
  MIGRATIONS_IMAGE: cr.yandex/${{ secrets.YC_REGISTRY_ID }}/ion-gift-card-migrations:${{ github.ref_name }}

jobs:
  release:
    name: Build and deploy release
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Login to Yandex Cloud Container Registry
        uses: yc-actions/yc-cr-login@v3
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}

      - name: Build and push API image
        run: |
          docker build --target api -t "$API_IMAGE" .
          docker push "$API_IMAGE"

      - name: Build and push bot webhook image
        run: |
          docker build --target bot-webhook -t "$BOT_WEBHOOK_IMAGE" .
          docker push "$BOT_WEBHOOK_IMAGE"

      - name: Build and push migrations image
        run: |
          docker build --target migrations -t "$MIGRATIONS_IMAGE" .
          docker push "$MIGRATIONS_IMAGE"

      - name: Run database migrations
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_POOL_MIN: ${{ vars.DB_POOL_MIN || '0' }}
          DB_POOL_MAX: ${{ vars.DB_POOL_MAX || '2' }}
        run: |
          docker run --rm \
            -e DB_HOST \
            -e DB_PORT \
            -e DB_NAME \
            -e DB_USER \
            -e DB_PASSWORD \
            -e DB_POOL_MIN \
            -e DB_POOL_MAX \
            "$MIGRATIONS_IMAGE" \
            node --experimental-strip-types src/db/migrations/run.ts

      - name: Deploy API container
        uses: yc-actions/yc-sls-container-deploy@v4
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
          folder-id: ${{ secrets.YC_FOLDER_ID }}
          container-name: ${{ secrets.YC_API_CONTAINER_NAME }}
          revision-service-account-id: ${{ secrets.YC_RUNTIME_SA_ID }}
          revision-image-url: ${{ env.API_IMAGE }}
          revision-cores: 1
          revision-memory: 512Mb
          revision-core-fraction: 100
          revision-concurrency: 8
          revision-execution-timeout: 10
          revision-env: |
            API_HOST=0.0.0.0
            DB_POOL_MIN=${{ vars.DB_POOL_MIN || '0' }}
            DB_POOL_MAX=${{ vars.DB_POOL_MAX || '2' }}
          revision-secrets: |
            DB_HOST=${{ secrets.YC_LOCKBOX_SECRET_ID }}/latest/DB_HOST
            DB_PORT=${{ secrets.YC_LOCKBOX_SECRET_ID }}/latest/DB_PORT
            DB_NAME=${{ secrets.YC_LOCKBOX_SECRET_ID }}/latest/DB_NAME
            DB_USER=${{ secrets.YC_LOCKBOX_SECRET_ID }}/latest/DB_USER
            DB_PASSWORD=${{ secrets.YC_LOCKBOX_SECRET_ID }}/latest/DB_PASSWORD

      - name: Deploy bot webhook container
        uses: yc-actions/yc-sls-container-deploy@v4
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
          folder-id: ${{ secrets.YC_FOLDER_ID }}
          container-name: ${{ secrets.YC_BOT_CONTAINER_NAME }}
          revision-service-account-id: ${{ secrets.YC_RUNTIME_SA_ID }}
          revision-image-url: ${{ env.BOT_WEBHOOK_IMAGE }}
          revision-cores: 1
          revision-memory: 512Mb
          revision-core-fraction: 100
          revision-concurrency: 8
          revision-execution-timeout: 10
          revision-env: |
            TELEGRAM_MODE=webhook
            API_HOST=0.0.0.0
            DB_POOL_MIN=${{ vars.DB_POOL_MIN || '0' }}
            DB_POOL_MAX=${{ vars.DB_POOL_MAX || '2' }}
          revision-secrets: |
            DB_HOST=${{ secrets.YC_LOCKBOX_SECRET_ID }}/latest/DB_HOST
            DB_PORT=${{ secrets.YC_LOCKBOX_SECRET_ID }}/latest/DB_PORT
            DB_NAME=${{ secrets.YC_LOCKBOX_SECRET_ID }}/latest/DB_NAME
            DB_USER=${{ secrets.YC_LOCKBOX_SECRET_ID }}/latest/DB_USER
            DB_PASSWORD=${{ secrets.YC_LOCKBOX_SECRET_ID }}/latest/DB_PASSWORD
            TELEGRAM_BOT_TOKEN=${{ secrets.YC_LOCKBOX_SECRET_ID }}/latest/TELEGRAM_BOT_TOKEN
            TELEGRAM_WEBHOOK_SECRET=${{ secrets.YC_LOCKBOX_SECRET_ID }}/latest/TELEGRAM_WEBHOOK_SECRET
            WEB_APP_URL=${{ secrets.YC_LOCKBOX_SECRET_ID }}/latest/WEB_APP_URL

      - name: Register Telegram webhook
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          TELEGRAM_WEBHOOK_URL: ${{ secrets.TELEGRAM_WEBHOOK_URL }}
        run: |
          curl --fail --show-error --silent "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" \
            --data-urlencode "url=${TELEGRAM_WEBHOOK_URL}/webhook" \
            --data-urlencode "secret_token=${TELEGRAM_WEBHOOK_SECRET}"

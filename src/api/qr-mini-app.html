<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #111111);
      display: grid;
      place-items: center;
    }

    main {
      width: min(100% - 32px, 420px);
    }

    h1 {
      font-size: 24px;
      margin: 0 0 12px;
    }

    p {
      color: var(--tg-theme-hint-color, #667085);
      line-height: 1.45;
      margin: 0 0 20px;
    }

    button {
      width: 100%;
      min-height: 48px;
      border: 0;
      border-radius: 8px;
      background: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #ffffff);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    .result {
      margin-top: 18px;
      padding: 14px;
      border: 1px solid var(--tg-theme-section_separator_color, #d0d5dd);
      border-radius: 8px;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <main>
    <h1 id="page-title"></h1>
    <p id="page-description"></p>
    <button id="scan-button" type="button"></button>
    <div id="result" class="result" hidden></div>
  </main>

  <script>
    const tg = window.Telegram?.WebApp;
    const copy = __QR_MINI_APP_COPY__;
    const pageTitle = document.getElementById('page-title');
    const pageDescription = document.getElementById('page-description');
    const button = document.getElementById('scan-button');
    const result = document.getElementById('result');
    const params = new URLSearchParams(window.location.search);
    const action = params.get('action') || 'balance';
    const amount = Number(params.get('amount'));
    const description = params.get('description') || undefined;

    function show(message) {
      result.hidden = false;
      result.textContent = message;
    }

    function sendCodeToBot(code) {
      if (!tg?.sendData) {
        show(copy.sendFailed);
        return false;
      }

      const payload = { action, code };
      if (Number.isFinite(amount) && amount > 0) {
        payload.amount = amount;
      }
      if (description) {
        payload.description = description;
      }

      tg.sendData(JSON.stringify(payload));
      tg.close();
      return true;
    }

    function scan() {
      if (!window.Telegram?.WebApp?.showScanQrPopup) {
        show(copy.scannerUnavailable);
        return;
      }

      window.Telegram.WebApp.showScanQrPopup({ text: copy.scanPopup }, (code) => {
        window.Telegram.WebApp.closeScanQrPopup();
        sendCodeToBot(code);
        return true;
      });
    }

    document.title = copy.title;
    pageTitle.textContent = copy.title;
    pageDescription.textContent = copy.description;
    button.textContent = copy.scanButton;
    tg?.ready();
    tg?.expand();
    button.addEventListener('click', scan);
  </script>
</body>
</html>
